{% extends '../base.html' %}
{% load static%}
{% block extra %}
<link rel="stylesheet" href="{% static 'styles/details.css'%}">
{% endblock %}
{% block content%}
<div class="container">
  <div class="title">
    <h3>Insira as informações de faturamento.</h3>
  </div>
  <form method="post">
    {%csrf_token%}
    <div class="col">
      <label>Morada de Faturação</label>
      <input placeholder="endereço da Rua" type="text" name="address" required>
    </div>
    <div class="col-row">

      <div class="col">
        <label>Cidade</label>
        <input type="text" name="city" required placeholder="Cidade">
      </div>

      <div class="col">
        <label>Estado</label>
        <input type="text" name="state" required placeholder="Estado" id="">
      </div>

      <div class="col">
        <label>CEP</label>
        <input type="number" name="zipcode" required placeholder="CEP">
      </div>
    </div>

    <div class="col">
      <label>Telefone Celular</label>
      <input type="text" name="number" required placeholder="(55) 55555-5555" id="number">
    </div>
    <div class="col">
      <label>Data de nascimento</label>
      <input id="date" type="text" name="dob" required id="">
    </div>
    <div class="col">
      <label>CPF</label>
      <input type="text" name="cpf" required placeholder="XXX-XXX-XXX-XX" id="cpf">
    </div>


    <button type="submit">Continue</button>

  </form>
  <br>

</div>
<!-- </div> -->
</div>
{%endblock%}
{% block js %}

<script src="{% static 'js/app.js' %}"></script>
<script>
  $("#cpf").mask("000-000-000-00");
  $("#date").mask("00/00/0000");
  $("#number").mask("(00) 00000-0000");
</script>
{% endblock %}
